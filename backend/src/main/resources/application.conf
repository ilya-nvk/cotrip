ktor {
  deployment {
    port = ${?PORT}
  }
  application {
    modules = [ nvk.cotrip.backend.ApplicationKt.module ]
  }

  jwt {
    issuer = ${?JWT_ISSUER}
    audience = ${?JWT_AUDIENCE}
    realm = "cotrip"
    secret = ${?JWT_SECRET}
  }

  db {
    url = ${?DATABASE_URL}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
    poolSize = 10
  }

  invite {
    baseUrl = ${?INVITE_BASE_URL}
  }

  weather {
    openWeatherApiKey = ${?OPENWEATHER_API_KEY}
    refreshTtlHours = ${?WEATHER_REFRESH_TTL_HOURS}
  }

  ai {
    provider = ${?ALICE_AI_PROVIDER}
    yandexApiKey = ${?YC_AI_API_KEY}
    yandexFolderId = ${?YC_FOLDER_ID}
    yandexModel = ${?YC_AI_MODEL}
    requestTimeoutMillis = ${?YC_AI_TIMEOUT_MS}
    maxSuggestions = ${?YC_AI_MAX_SUGGESTIONS}
  }

  media {
    uploadDir = ${?MEDIA_UPLOAD_DIR}
    maxUploadBytes = ${?MEDIA_MAX_UPLOAD_BYTES}
  }

  devAuthEnabled = ${?DEV_AUTH_ENABLED}
}
