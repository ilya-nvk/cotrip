name: Reset Production Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET_COTRIP_DB to confirm destructive reset"
        required: true
        type: string

concurrency:
  group: reset-cotrip-db
  cancel-in-progress: false

jobs:
  reset-db:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirmation }}" != "RESET_COTRIP_DB" ]; then
            echo "Invalid confirmation phrase."
            echo "You must type RESET_COTRIP_DB to proceed."
            exit 1
          fi

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reset cotrip database and restart backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" << 'SSH'
            set -euo pipefail

            sudo -u postgres psql -X -d postgres -v ON_ERROR_STOP=1 << 'SQL'
              REVOKE CONNECT ON DATABASE cotrip FROM public;
              SELECT pg_terminate_backend(pid)
              FROM pg_stat_activity
              WHERE datname = 'cotrip';
              DROP DATABASE cotrip;
              CREATE DATABASE cotrip OWNER cotrip;
          SQL

            sudo systemctl restart cotrip
            sudo systemctl is-active --quiet cotrip
          SSH

      - name: Health check
        run: |
          set -euo pipefail
          for i in {1..20}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.cotrip.site/health || true)
            if [ "$CODE" = "200" ]; then
              echo "Health check OK"
              exit 0
            fi
            echo "Health check not ready (HTTP $CODE), retrying..."
            sleep 3
          done
          echo "Health check failed"
          exit 1
