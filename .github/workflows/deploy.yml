name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x backend/gradlew

      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew clean build shadowJar

      - name: Select deploy jar
        id: jar
        run: |
          set -euo pipefail
          LIBS_DIR="backend/build/libs"

          if ls "$LIBS_DIR"/*-all.jar >/dev/null 2>&1; then
            JAR=$(ls -1 "$LIBS_DIR"/*-all.jar | head -n 1)
            REASON="shadow/fat jar (*-all.jar)"
          else
            JARS=$(ls -1 "$LIBS_DIR"/*.jar 2>/dev/null | grep -Ev '(-sources|-javadoc|-plain)\.jar$' || true)
            COUNT=$(echo "$JARS" | sed '/^$/d' | wc -l | tr -d ' ')

            if [ "$COUNT" -eq 1 ]; then
              JAR="$JARS"
              REASON="only runnable jar found (thin jar)"
            else
              echo "Unable to determine jar. Contents of $LIBS_DIR:"
              ls -1 "$LIBS_DIR"
              exit 1
            fi
          fi

          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"
          echo "jar_reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Selected $JAR ($REASON)"

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Upload jar to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          JAR_PATH: ${{ steps.jar.outputs.jar_path }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=no "$JAR_PATH" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/cotrip-app.jar"

      - name: Restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" << 'SSH'
            sudo mv /tmp/cotrip-app.jar /opt/cotrip/app.jar
            sudo systemctl restart cotrip
            sudo systemctl is-active --quiet cotrip
          SSH

      - name: Health check
        run: |
          set -euo pipefail
          for i in {1..20}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.cotrip.site/health || true)
            if [ "$CODE" = "200" ]; then
              echo "Health check OK"
              exit 0
            fi
            echo "Health check not ready (HTTP $CODE), retrying..."
            sleep 3
          done
          echo "Health check failed"
          exit 1
