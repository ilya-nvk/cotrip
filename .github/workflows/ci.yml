name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'android/**'
      - 'quality-check.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'android/**'
      - 'quality-check.sh'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x backend/gradlew

      - name: Build
        working-directory: backend
        run: ./gradlew build

      - name: Test & coverage report
        run: |
          chmod +x .github/scripts/test-coverage-summary.sh
          .github/scripts/test-coverage-summary.sh "Backend" \
            backend/build/test-results/test \
            backend/build/reports/jacoco/test/jacocoTestReport.xml \
            50 \
            40

      - name: Quality check
        working-directory: backend
        run: ./gradlew qualityCheck

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Google Sign-In client id
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: |
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "GOOGLE_SERVER_CLIENT_ID secret is missing."
            echo "Set it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [[ "$GOOGLE_SERVER_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "GOOGLE_SERVER_CLIENT_ID looks invalid: expected a Web OAuth client id ending with .apps.googleusercontent.com"
            exit 1
          fi

      - name: Restore google-services.json from secret
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_B64 != '' }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Continue without google-services.json
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_B64 == '' }}
        run: echo "ANDROID_GOOGLE_SERVICES_JSON_B64 is not set, build continues without google-services.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build
        working-directory: android
        run: ./gradlew build -x lint -x :app:testReleaseUnitTest

      - name: Test & coverage report
        run: |
          cd android && ./gradlew :app:jacocoDebugUnitTestReport && cd ..
          chmod +x .github/scripts/test-coverage-summary.sh
          .github/scripts/test-coverage-summary.sh "Android" \
            android/app/build/test-results/testDebugUnitTest \
            android/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml \
            50 \
            40

      - name: Quality check
        working-directory: android
        run: ./gradlew :app:qualityCheck

      - name: Upload Android test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
