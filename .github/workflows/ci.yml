name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'android/**'
      - 'quality-check.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      run_release_apk:
        description: "Build signed Android release APK"
        required: true
        default: true
        type: boolean

jobs:
  backend:
    name: Backend
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x backend/gradlew

      - name: Build
        working-directory: backend
        run: ./gradlew build

      - name: Test & coverage report
        run: |
          chmod +x .github/scripts/test-coverage-summary.sh
          .github/scripts/test-coverage-summary.sh "Backend" \
            backend/build/test-results/test \
            backend/build/reports/jacoco/test/jacocoTestReport.xml \
            50 \
            40

      - name: Quality check
        working-directory: backend
        run: ./gradlew qualityCheck

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          if-no-files-found: ignore

  android:
    name: Android
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || vars.GOOGLE_SERVER_CLIENT_ID }}
      HAS_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID != '' || vars.GOOGLE_SERVER_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug Google Sign-In config wiring
        run: |
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "is_fork_pr=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}"
          echo "google_client_id_present=$HAS_GOOGLE_SERVER_CLIENT_ID"

      - name: Validate Google Sign-In client id
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: |
          if [ "$HAS_GOOGLE_SERVER_CLIENT_ID" != "true" ]; then
            echo "GOOGLE_SERVER_CLIENT_ID secret is missing."
            echo "Set it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [[ "$GOOGLE_SERVER_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "GOOGLE_SERVER_CLIENT_ID looks invalid: expected a Web OAuth client id ending with .apps.googleusercontent.com"
            exit 1
          fi

      - name: Restore google-services.json from secret
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_B64 != '' }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Continue without google-services.json
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_B64 == '' }}
        run: echo "ANDROID_GOOGLE_SERVICES_JSON_B64 is not set, build continues without google-services.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build
        working-directory: android
        env:
          REQUIRE_GOOGLE_SERVER_CLIENT_ID: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: ./gradlew build -x lint -x :app:testReleaseUnitTest -PGOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Test & coverage report
        env:
          REQUIRE_GOOGLE_SERVER_CLIENT_ID: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: |
          cd android && ./gradlew :app:jacocoDebugUnitTestReport -PGOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" && cd ..
          chmod +x .github/scripts/test-coverage-summary.sh
          .github/scripts/test-coverage-summary.sh "Android" \
            android/app/build/test-results/testDebugUnitTest \
            android/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml \
            50 \
            40

      - name: Quality check
        working-directory: android
        env:
          REQUIRE_GOOGLE_SERVER_CLIENT_ID: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: ./gradlew :app:qualityCheck -PGOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Upload Android test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

  android-release-apk:
    name: Android Release APK
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_release_apk)
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || vars.GOOGLE_SERVER_CLIENT_ID }}
      HAS_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID != '' || vars.GOOGLE_SERVER_CLIENT_ID != '' }}
      ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug release Google Sign-In config wiring
        run: |
          echo "google_client_id_present=$HAS_GOOGLE_SERVER_CLIENT_ID"
          echo "google_client_id_length=${#GOOGLE_SERVER_CLIENT_ID}"

      - name: Validate release Google Sign-In client id
        run: |
          if [ "$HAS_GOOGLE_SERVER_CLIENT_ID" != "true" ]; then
            echo "GOOGLE_SERVER_CLIENT_ID secret/variable is missing for release APK build."
            exit 1
          fi
          if [[ "$GOOGLE_SERVER_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "GOOGLE_SERVER_CLIENT_ID looks invalid: expected a Web OAuth client id ending with .apps.googleusercontent.com"
            exit 1
          fi

      - name: Restore google-services.json from secret
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_B64 != '' }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Continue without google-services.json
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_B64 == '' }}
        run: echo "ANDROID_GOOGLE_SERVICES_JSON_B64 is not set, build continues without google-services.json"

      - name: Validate Android signing secrets
        run: |
          missing=0
          for key in \
            ANDROID_RELEASE_KEYSTORE_B64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS
          do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore release keystore from secret
        run: |
          echo "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > android/release-keystore.jks

      - name: Validate keystore and alias
        working-directory: android
        run: |
          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            >/dev/null

          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Assemble release APK
        working-directory: android
        env:
          REQUIRE_GOOGLE_SERVER_CLIENT_ID: "true"
        run: ./gradlew :app:assembleRelease -PGOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Sign release APK
        working-directory: android
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          KEY_PASS="$ANDROID_RELEASE_KEY_PASSWORD"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          fi

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release-keystore.jks \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"

      - name: Remove release keystore
        if: always()
        run: rm -f android/release-keystore.jks

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-signed-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release-signed.apk
            android/app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
